services:
  api:
    # Build from the SAME build-base stage as the prod image (Debian trixie +
    # pinned railpack/pack) so dev and prod share one build toolchain. Go and the
    # non-root vscode user are layered on via devcontainer features (see
    # devcontainer.json).
    build:
      context: ..
      dockerfile: Dockerfile
      target: build-base
    command: sleep infinity
    volumes:
      - ..:/workspaces/belune:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/tmp/belune-builds:/var/tmp/belune-builds
      # Cache Go state across container rebuilds — module downloads, build
      # cache, and `go install` binaries (air, dlv, migrate, etc.).
      - go-mod-cache:/home/vscode/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - go-bin-cache:/home/vscode/go/bin
      # Isolate the web node_modules from the host bind-mount: the host installs
      # darwin-native esbuild/rollup binaries, but Vite runs on Linux in here.
      - web-node-modules:/workspaces/belune/apps/web/node_modules
    environment:
      DATABASE_URL: postgres://belune:belune@postgres:5432/belune?sslmode=disable
      REDIS_URL: redis://redis:6379
      CADDY_ADMIN_URL: http://caddy:2019
      BUILDKIT_HOST: tcp://buildkit:1234
      TMPDIR: /var/tmp/belune-builds
      PORT: "8080"
      METRICS_BIND: 0.0.0.0:9090
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_EXPORTER_OTLP_INSECURE: true
    env_file:
      - ../.env
    networks:
      - default
      - belune-infra
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  go-mod-cache:
  go-build-cache:
  go-bin-cache:
  web-node-modules:

networks:
  belune-infra:
    name: belune-infra
    external: true
  default: {}
