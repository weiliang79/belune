openapi: '3.1.0'
info:
  title: Self-Hosted PaaS API
  version: '1.0.0'
  description: API for managing projects, services, databases, and deployments.

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: Login successful

  /api/auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      responses:
        '200':
          description: Current user info

  /api/projects:
    get:
      summary: List projects
      tags: [Projects]
      responses:
        '200':
          description: List of projects
    post:
      summary: Create project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        '201':
          description: Project created

  /api/projects/{projectId}/services:
    get:
      summary: List services
      tags: [Services]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of services
    post:
      summary: Create service
      tags: [Services]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [git, image] }
                source_repo: { type: string }
                source_image: { type: string }
                build_type: { type: string, enum: [dockerfile, buildpacks, nixpacks, railpack, image] }
                builder_image: { type: string }
                custom_buildpacks: { type: array, items: { type: string } }
              required: [name, type]
      responses:
        '201':
          description: Service created

  /api/projects/{projectId}/services/{serviceId}/deploy:
    post:
      summary: Deploy service
      tags: [Deployments]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: serviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Deployment started

  /healthz:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Service is healthy
