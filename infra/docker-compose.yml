services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: belune
      POSTGRES_PASSWORD: belune
      POSTGRES_DB: belune
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belune"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./caddy/Caddyfile.template:/etc/caddy/Caddyfile
      - ./caddy/sites:/etc/caddy/sites
      - caddydata:/data
      - caddyconfig:/config
      - ./caddy/logs:/var/log/caddy
    networks:
      - default
      - belune-infra
    labels:
      - dev.orbstack.domains=*.belune.local

  buildkit:
    image: moby/buildkit:latest
    privileged: true
    ports:
      - "127.0.0.1:1234:1234"
    command: --addr tcp://0.0.0.0:1234 --config /etc/buildkit/buildkitd.toml
    volumes:
      - buildkitcache:/var/lib/buildkit
      - ./buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  buildkitcache:

networks:
  default: {}
  belune-infra:
    name: belune-infra
    external: true
