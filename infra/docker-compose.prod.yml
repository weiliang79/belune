services:
  belune:
    image: ${BELUNE_IMAGE:-ghcr.io/weiling79/belune:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # railpack (and pack) build via this BuildKit daemon on the internal network.
      BUILDKIT_HOST: tcp://buildkit:1234
    volumes:
      # Persist managed-database logical dumps (DATABASE_BACKUP_DIR=/data/backups/databases)
      # so local restore works across container recreation.
      - belunedata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkit:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-belune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-belune}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-belune}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # BuildKit daemon that railpack/pack use to build app images. Pinned to match
  # dev (infra/docker-compose.yml). Not exposed to the host — only the belune
  # service reaches it over the internal network. Requires privileged mode.
  buildkit:
    image: moby/buildkit:v0.31.1
    privileged: true
    command: --addr tcp://0.0.0.0:1234 --config /etc/buildkit/buildkitd.toml
    volumes:
      - buildkitcache:/var/lib/buildkit
      - ./buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./caddy/Caddyfile.template:/etc/caddy/Caddyfile
      - ./caddy/sites:/etc/caddy/sites
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  caddylogs:
  belunedata:
  buildkitcache:
