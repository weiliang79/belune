# Opt-in observability stack: Prometheus scrapes the PaaS API + Caddy admin
# metrics, Grafana renders the provisioned dashboards, and Jaeger receives
# OTLP traces if OTEL_EXPORTER_OTLP_ENDPOINT points at it.
#
# Bring up alongside the main infra stack:
#   task observability:up
#
# The stack joins the `belune-infra` external network so it can reach the API
# and Caddy containers by name.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: belune-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-lifecycle"
    networks:
      - belune-infra
    extra_hosts:
      # Lets Prometheus scrape the PaaS API running on the host when the API
      # is not containerised (dev via `task dev:api`).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: belune-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks:
      - belune-infra
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: belune-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    networks:
      - belune-infra
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:

networks:
  belune-infra:
    name: belune-infra
    external: true
