global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: belune

scrape_configs:
  # PaaS API — scraped over the belune-infra Docker network. Works for both
  # the devcontainer (.devcontainer/docker-compose.yml service `api`) and
  # the production stack (compose.prod.yml service `api`), since both attach
  # to `belune-infra` and register `api` as their service alias.
  - job_name: belune-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9090
        labels:
          component: api

  # Caddy admin metrics (enabled via `servers { metrics }` in Caddyfile).
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - caddy:2019
        labels:
          component: proxy

  # Self-scrape so Prometheus surfaces its own scrape health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
