global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: selfhost-paas

scrape_configs:
  # PaaS API — scraped via the loopback METRICS_BIND listener. When the API
  # runs inside Docker under compose.prod.yml, swap host.docker.internal for
  # the container name `api`.
  - job_name: paas-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9090
        labels:
          component: api

  # Caddy admin metrics (enabled via `servers { metrics }` in Caddyfile).
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - caddy:2019
        labels:
          component: proxy

  # Self-scrape so Prometheus surfaces its own scrape health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
